# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mss?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
# Changed from 'update' to 'none' — tables already exist in DB, no need for Hibernate to touch DDL
# 'update' was causing WARN on startup (trying to re-add existing FK constraints)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8082

# Logging
# Reduced Spring Web from DEBUG to WARN — too noisy (every CSS/JS request was logged)
# Keep your app package at DEBUG so you still see your own controller/service logs
logging.level.org.springframework.web=WARN
logging.level.com.pps.profilesystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.deprecation=OFF