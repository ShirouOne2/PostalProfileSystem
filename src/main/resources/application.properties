# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# File Upload Configuration - REQUIRED FOR EXCEL IMPORT
# Maximum file size (default 1MB is too small for Excel files)
spring.servlet.multipart.max-file-size=30MB
# Maximum request size
spring.servlet.multipart.max-request-size=30MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Temporary file location
spring.servlet.multipart.location=${java.io.tmpdir}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8082

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.pps.profilesystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG