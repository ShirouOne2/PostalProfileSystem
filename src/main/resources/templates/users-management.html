<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
</head>
<body>

<!-- Use the main layout -->
<div th:replace="~{layout/main-layout :: layout(~{::title}, ~{::content})}">
    
    <!-- Page Title -->
    <title>User Management - PPS Profile System</title>
    
    <!-- Page Content -->
    <div th:fragment="content">
        
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-users me-2"></i> User Management</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/table">Post Office</a></li>
                        <li class="breadcrumb-item active">Users</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-add-user" onclick="showAddModal()">
                <i class="fas fa-user-plus"></i> Add New User
            </button>
        </div>

        <!-- Content Card -->
        <div class="content-card">
            <div class="card-header-custom">
                <div>
                    <h5 class="mb-1" style="font-weight: 700;">All Users</h5>
                    <p class="text-muted mb-0" style="font-size: 14px;">Manage system users and their permissions</p>
                </div>
            </div>

            <!-- Users Table -->
            <div class="table-responsive">
                <table id="usersTable" class="table table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Area ID</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- User Modal Fragment -->
        <div th:replace="~{fragments/modals/User-modal :: userModal}"></div>
        
    </div>

</div>

</body>
</html>
