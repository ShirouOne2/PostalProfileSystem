<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header">

    <nav class="navbar navbar-expand navbar-light bg-white border-bottom shadow-sm sticky-top">
        <div class="container-fluid">

            <!-- Hamburger Menu for Mobile -->
            <button class="btn btn-link d-md-none mr-2" id="mobileSidebarToggle" type="button">
                <i class="fas fa-bars fa-lg text-primary"></i>
            </button>

            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="navbar-brand">
                <ol class="breadcrumb mb-0 bg-transparent p-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/table}" class="text-primary text-decoration-none">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" 
                        th:text="${activePage == 'dashboard' ? 'Dashboard' : 
                                activePage == 'table' ? 'Postal Office Locator' :
                                activePage == 'quarters' ? 'Connectivity' :
                                activePage == 'report' ? 'Report' :
                                activePage == 'insert' ? 'Add New Office' :
                                activePage == 'users' ? 'User Management' :
                                activePage == 'archive' ? 'Archive' : 'Page'}">
                        Page
                    </li>
                </ol>
            </nav>

            <!-- RIGHT SIDE -->
            <ul class="navbar-nav ml-auto align-items-center">

                <!-- Notification Bell — Admin only -->
                <li class="nav-item dropdown mr-3 position-relative"
                    id="notifBellLi"
                    sec:authorize="hasAnyRole('ADMIN','AREA_ADMIN')">

                    <!-- Bell button -->
                    <a class="nav-link text-muted p-2"
                       href="#"
                       id="alertsDropdown"
                       role="button"
                       data-toggle="dropdown"
                       aria-haspopup="true"
                       aria-expanded="false"
                       style="position:relative;display:inline-block;">

                        <i class="fas fa-bell fa-fw" style="font-size:17px;"></i>

                        <span id="notifBadge"
                              style="display:none;
                                     position:absolute;top:2px;right:0;
                                     font-size:9px;padding:2px 5px;
                                     border-radius:10px;min-width:18px;
                                     text-align:center;line-height:1.4;
                                     background:#dc3545;color:#fff;
                                     font-weight:700;">
                        </span>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right shadow notification-dropdown"
                         aria-labelledby="alertsDropdown"
                         style="min-width:360px;padding:0;border:none;
                                border-radius:10px;overflow:hidden;">

                        <div id="notifContent">
                            <div class="px-3 py-3 text-center text-muted" style="font-size:13px;">
                                <i class="fas fa-circle-notch fa-spin mr-1"></i>
                                Loading notifications…
                            </div>
                        </div>

                    </div>
                </li>
                <!-- end notification bell -->

                <!-- User Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center pl-3 border-left"
                       href="#" id="userDropdown" role="button" data-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false">

                        <div class="text-right mr-2 d-none d-md-block">
                            <div style="font-size:13px;font-weight:700;color:#333;"
                                 th:text="${loggedInUsername ?: 'User'}">User</div>
                            <div style="font-size:11px;color:#777;"
                                 th:text="${loggedInRole ?: 'User'}">User</div>
                        </div>

                        <div class="bg-primary text-white rounded-circle
                                    d-flex align-items-center justify-content-center"
                             style="width:35px;height:35px;font-weight:bold;border:2px solid #eef2f7;"
                             th:text="${loggedInInitial ?: 'U'}">U</div>
                    </a>

                    <div class="dropdown-menu dropdown-menu-right shadow" aria-labelledby="userDropdown">
                        <a class="dropdown-item" th:href="@{/my-profile}">
                            <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i> Profile
                        </a>
                        <div sec:authorize="hasRole('ADMIN')">
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" th:href="@{/users}">
                                <i class="fas fa-users fa-sm fa-fw mr-2 text-gray-400"></i> Manage Users
                            </a>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" th:href="@{/logout}" onclick="if(window._sseClose)window._sseClose();">
                            <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Logout
                        </a>
                    </div>
                </li>

            </ul>
        </div>
    </nav>

    <style>
        #notifBadge { transition: transform .15s ease, opacity .15s ease; }

        .notification-dropdown { max-height: 420px; }

        .notification-dropdown #notifContent {
            max-height: 380px;
            overflow-y: auto;
        }

        .notification-dropdown #notifContent::-webkit-scrollbar { width: 4px; }
        .notification-dropdown #notifContent::-webkit-scrollbar-thumb {
            background: #ccc; border-radius: 4px;
        }

        .notif-item:hover { background: #eef4ff !important; }

        @keyframes bellShake {
            0%,100% { transform: rotate(0); }
            20%      { transform: rotate(-15deg); }
            40%      { transform: rotate(15deg); }
            60%      { transform: rotate(-10deg); }
            80%      { transform: rotate(10deg); }
        }
        .bell-shake .fa-bell { animation: bellShake .5s ease; }
    </style>

    <script>
    (function () {

        var bellLi       = document.getElementById('notifBellLi');
        var badge        = document.getElementById('notifBadge');
        var notifContent = document.getElementById('notifContent');

        if (!bellLi || !notifContent) return;

        var es;
        var retryDelay = 3000;

        function connect() {
            es = new EventSource('/api/notifications/stream');

            es.addEventListener('badge', function (e) {
                var count = (e.data || '').trim();
                if (count !== '' && count !== '0') {
                    badge.textContent   = count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.textContent   = '';
                    badge.style.display = 'none';
                }
            });

            es.addEventListener('notification', function (e) {
                var html = (e.data || '').trim();
                if (!html) return;

                notifContent.innerHTML = html;
                bindMarkRead();

                bellLi.classList.remove('bell-shake');
                void bellLi.offsetWidth;
                bellLi.classList.add('bell-shake');
            });

            es.onerror = function () {
                es.close();
                setTimeout(connect, retryDelay);
                retryDelay = Math.min(retryDelay * 2, 30000);
            };

            es.onopen = function () {
                retryDelay = 3000;
            };
        }

        function bindMarkRead() {
            notifContent.querySelectorAll('[data-notif-id]').forEach(function (el) {
                el.replaceWith(el.cloneNode(true));
            });
            notifContent.querySelectorAll('[data-notif-id]').forEach(function (el) {
                el.addEventListener('click', function () {
                    fetch('/api/notifications/mark-read/' + this.getAttribute('data-notif-id'),
                          { method: 'POST' });
                });
            });

            var markAllBtn = notifContent.querySelector('[data-mark-all-read]');
            if (markAllBtn) {
                markAllBtn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    ev.stopPropagation();
                    fetch('/api/notifications/mark-all-read', { method: 'POST' });
                });
            }
        }

        connect();

        window._sseClose = function () {
            if (es) { es.close(); es = null; }
        };

    })();
    </script>

</div>
</html>
