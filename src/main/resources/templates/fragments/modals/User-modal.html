<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Modal</title>
</head>
<body>

<!-- User Modal Fragment -->
<div th:fragment="userModal">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ✅ Bootstrap 4 uses jQuery events
            $('#userModal').on('hidden.bs.modal', function () {
                resetUserForm();
            });
        });
        
        function resetUserForm() {
            const userForm = document.getElementById('userForm');
            if (userForm) {
                userForm.reset();
                
                const formElements = userForm.querySelectorAll('.form-control, .form-select');
                formElements.forEach(element => {
                    element.classList.remove('is-invalid');
                });
                
                const passwordHint = document.getElementById('passwordHint');
                if (passwordHint) passwordHint.style.display = 'none';
                
                const passwordStrengthBar = document.getElementById('passwordStrengthBar');
                const passwordStrengthText = document.getElementById('passwordStrengthText');
                if (passwordStrengthBar) passwordStrengthBar.className = 'password-strength-bar';
                if (passwordStrengthText) passwordStrengthText.textContent = '';
            }
        }
    </script>
    
    <!-- Add/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="fas fa-user-plus mr-2"></i> Add New User
                    </h5>
                    <!-- ✅ FIXED: data-dismiss="modal" (Bootstrap 4), NOT data-bs-dismiss -->
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <input type="hidden" id="isEdit">

                        <!-- Username -->
                        <div class="form-group">
                            <label for="username" class="form-label">
                                Username <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="username" 
                                   placeholder="Enter username" required minlength="3">
                            <div class="invalid-feedback">Username must be at least 3 characters</div>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label">
                                Email <span class="required">*</span>
                            </label>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="Enter email address" required>
                            <div class="invalid-feedback">Please enter a valid email</div>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password" class="form-label">
                                Password <span class="required" id="passwordRequired">*</span>
                            </label>
                            <input type="password" class="form-control" id="password" 
                                   placeholder="Enter password" minlength="6">
                            <div class="password-strength">
                                <div class="password-strength-bar" id="passwordStrengthBar"></div>
                            </div>
                            <div class="password-strength-text" id="passwordStrengthText"></div>
                            <div class="invalid-feedback">Password must be at least 6 characters</div>
                            <small class="text-muted" id="passwordHint" style="display:none;">
                                Leave blank to keep current password
                            </small>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-group" id="confirmPasswordGroup">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password <span class="required" id="confirmRequired">*</span>
                            </label>
                            <input type="password" class="form-control" id="confirmPassword" 
                                   placeholder="Confirm password">
                            <div class="invalid-feedback">Passwords do not match</div>
                        </div>

                        <!-- Role -->
                        <div class="form-group">
                            <label for="role" class="form-label">
                                Role <span class="required">*</span>
                            </label>
                            <select class="form-control" id="role" required>
                                <option value="">Select role...</option>
                                <option value="1">Admin</option>
                                <option value="2">User</option>
                                <option value="3">Manager</option>
                            </select>
                            <div class="invalid-feedback">Please select a role</div>
                        </div>

                        <!-- Area ID -->
                        <div class="form-group">
                            <label for="areaId" class="form-label">
                                Area ID <small class="text-muted">(Optional)</small>
                            </label>
                            <input type="number" class="form-control" id="areaId" 
                                   placeholder="Enter area ID">
                        </div>

                        <!-- Status -->
                        <div class="form-group">
                            <label for="status" class="form-label">
                                Status <span class="required">*</span>
                            </label>
                            <select class="form-control" id="status" required>
                                <option value="">Select status...</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                            <div class="invalid-feedback">Please select a status</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <!-- ✅ FIXED: data-dismiss="modal" (Bootstrap 4) -->
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times mr-2"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">
                        <i class="fas fa-save mr-2"></i> Save User
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Styles Fragment -->
<div th:fragment="userModalStyles">
    <style>
        .modal-content {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px 30px;
        }

        .modal-header .modal-title {
            font-weight: 700;
            font-size: 20px;
        }

        /* ✅ FIXED: Bootstrap 4 close button styling */
        .modal-header .close {
            color: white;
            opacity: 1;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: none;
            padding: 0;
            margin: -1rem -1rem -1rem auto;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .modal-header .close:hover {
            opacity: 0.75;
            transform: scale(1.1);
        }

        .modal-header .close:focus {
            outline: none;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 1px solid #e0e0e0;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }

        .form-label .required {
            color: #e74a3b;
            margin-left: 3px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.15);
        }

        .form-control.is-invalid {
            border-color: #e74a3b;
        }

        .invalid-feedback {
            font-size: 13px;
            margin-top: 5px;
        }

        /* Password Strength */
        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 8px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            width: 0%;
        }

        .password-strength-bar.weak   { background: #e74a3b; width: 33%; }
        .password-strength-bar.medium { background: #f6c23e; width: 66%; }
        .password-strength-bar.strong { background: #1cc88a; width: 100%; }

        .password-strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: #666;
        }
    </style>
</div>

</body>
</html>
