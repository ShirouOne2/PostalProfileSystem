<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Quarters Management - POST OFFICE</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/header.css}">
<link rel="stylesheet" th:href="@{/css/quarters.css}">
</head>

<body>

<div class="page-wrapper">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

<div th:replace="~{fragments/header :: header}"></div>

<main class="main-body p-4">
<div class="container-fluid">

<!-- HEADER -->
<div class="row mb-4">
<div class="col-12">
<div class="bg-white p-3 rounded shadow-sm">
<h4 class="font-weight-bold mb-0">
<i class="fas fa-calendar-alt text-primary mr-2"></i>
Quarters Management - <span th:text="${currentYear}">2026</span>
</h4>
</div>
</div>
</div>

<!-- SUMMARY CARDS -->
<div class="row mb-4">
<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6 class="text-muted">Active</h6>
<h2 th:text="${connectivityStats.totalConnected}">628</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6 class="text-muted">Inactive</h6>
<h2 th:text="${connectivityStats.totalDisconnected}">629</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-center shadow-sm">
<div class="card-body">
<h6 class="text-muted">Total</h6>
<h2 th:text="${connectivityStats.totalOffices}">1257</h2>
</div>
</div>
</div>
</div>

<!-- CONNECTIVITY PROGRESS -->
<div class="connectivity-progress mb-4">

<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
<h4 class="font-weight-bold mb-2">
<i class="fas fa-chart-line text-primary mr-2"></i>
Connectivity Growth per Quarter
</h4>

<div class="d-flex align-items-center">
<label class="mr-2 mb-0">Year:</label>
<select id="yearSelector"
        class="form-control form-control-sm"
        style="width:100px"
        onchange="loadQuarterData()">
<option th:each="year : ${#numbers.sequence(2020, #dates.year(#dates.createNow()))}"
        th:value="${year}"
        th:text="${year}"
        th:selected="${year == currentYear}">
</option>
</select>
</div>
</div>




<!-- CONNECTIVITY BOXES -->
<div class="row mb-4">

<div class="col-md-6">
<div class="card shadow-sm">
<div class="card-header bg-success text-white">With Connectivity</div>
<div class="card-body">
<div class="p-3 border rounded">
<div class="d-flex justify-content-between">
<div><b>Q1 2026</b><br><small>Total Connected: 593</small></div>
<span class="badge badge-success p-2">+1</span>
</div>
</div>
</div>
</div>
</div>

<div class="col-md-6">
<div class="card shadow-sm">
<div class="card-header bg-danger text-white">Without Connectivity</div>
<div class="card-body">
<div class="p-3 border rounded">
<div class="d-flex justify-content-between">
<div><b>Q1 2026</b><br><small>Total Disconnected: 539</small></div>
<span class="badge badge-danger p-2">+0</span>
</div>
</div>
</div>
</div>
</div>

</div>

<!-- FILTERS -->
<div class="row mb-3">
<div class="col-12 d-flex flex-wrap">

<select id="areaFilter" class="form-control mr-2 mb-2" style="max-width:200px">
<option value="">All Areas</option>
<option th:each="area : ${areas}" th:value="${area}" th:text="${area}"></option>
</select>

<select id="quarterFilter" class="form-control mr-2 mb-2" style="max-width:200px">
<option value="">All Quarters</option>
<option value="Q1">Q1 (Jan–Mar)</option>
<option value="Q2">Q2 (Apr–Jun)</option>
<option value="Q3">Q3 (Jul–Sep)</option>
<option value="Q4">Q4 (Oct–Dec)</option>
</select>

<select id="statusFilter" class="form-control mr-2 mb-2" style="max-width:200px">
<option value="">All Status</option>
<option value="active">Active</option>
<option value="inactive">Inactive</option>
</select>

</div>
</div>

<!-- TABLE -->
<div class="table-responsive">
<table id="postOfficeTable" class="table table-striped table-bordered">
<thead class="thead-dark">
<tr>
<th>#</th>
<th>AREA</th>
<th>POSTAL OFFICE</th>
<th>PROVINCE</th>
<th>SPEED</th>
<th>STATUS</th>
<th>REMARKS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>
</main>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/quarters.js}"></script>

</body>
</html>
