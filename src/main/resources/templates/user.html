<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - PPS Profile System</title>
    <link rel="stylesheet" href="users.css">
</head>
<body>
    <button class="btn btn-secondary logout-btn" onclick="logout()">Logout</button>

    <div class="container">
        <div class="header">
            <h1>User Management</h1>
            <button class="btn btn-primary" onclick="showAddModal()">+ Add New User</button>
        </div>

        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Users will be loaded here -->
            </tbody>
        </table>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h3>No users found</h3>
            <p>Click "Add New User" to create your first user.</p>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New User</h2>
            </div>

            <form id="userForm">
                <input type="hidden" id="userId">

                <div class="form-group">
                    <label for="userName">Name</label>
                    <input type="text" id="userName" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" id="userEmail" required>
                </div>

                <div class="form-group">
                    <label for="userPassword">Password</label>
                    <input type="password" id="userPassword">
                    <small style="color: #999;">Leave blank to keep current password</small>
                </div>

                <div class="form-group">
                    <label for="userRole">Role</label>
                    <select id="userRole">
                        <option value="USER">User</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="userActive" checked> Active
                    </label>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <script src="users.js"></script>
</body>
</html>
