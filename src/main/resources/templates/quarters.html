<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::content})}">

<head>
    <title>Quarters Management</title>
</head>

<body>

<div th:fragment="content">

    <div class="container-fluid">

        <!-- Header Card -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center flex-wrap bg-white p-3 rounded shadow-sm border-left-primary">
                    <div>
                        <h4 class="mb-1 font-weight-bold text-dark">
                            <i class="fas fa-calendar-alt text-primary mr-2"></i> 
                            Quarters Management - <span th:text="${currentYear}">2026</span>
                        </h4>
                        <div class="mt-2">
                            <span class="badge badge-info py-2 px-3">
                                <i class="fas fa-clock mr-1"></i> Current Quarter: 
                                <span th:text="${currentQuarterInfo.quarter}">Q1</span> 
                                (<span th:text="${currentQuarterInfo.monthName}">FEBRUARY</span>)
                            </span>
                            <button class="btn btn-sm btn-outline-primary ml-2" id="manualUpdateBtn">
                                <i class="fas fa-sync"></i> Update Now
                            </button>
                        </div>
                    </div>
                    
                    <div class="mt-3 mt-md-0">
                        <button type="button" class="btn btn-info btn-sm shadow-sm" data-toggle="modal" data-target="#mapmodal">
                            <i class="fas fa-map"></i> View Map
                        </button>
                        <button type="button" class="btn btn-success btn-sm shadow-sm" id="printReportBtn">
                            <i class="fas fa-print"></i> Print
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Connectivity Cards -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card border-0 shadow-sm h-100 text-center py-4 border-bottom-success">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase font-weight-bold mb-3">
                            <i class="fas fa-wifi text-success mr-2"></i> Active
                        </h6>
                        <h2 class="display-4 font-weight-bold mb-0 text-dark" th:text="${connectivityStats.totalConnected}">628</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card border-0 shadow-sm h-100 text-center py-4 border-bottom-danger">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase font-weight-bold mb-3">
                            <i class="fas fa-wifi-slash text-danger mr-2"></i> Inactive
                        </h6>
                        <h2 class="display-4 font-weight-bold mb-0 text-dark" th:text="${connectivityStats.totalDisconnected}">629</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card border-0 shadow-sm h-100 text-center py-4 border-bottom-primary">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase font-weight-bold mb-3">
                            <i class="fas fa-building text-primary mr-2"></i> Total
                        </h6>
                        <h2 class="display-4 font-weight-bold mb-0 text-dark" th:text="${connectivityStats.totalOffices}">1257</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLE -->
        <div id="dataTableSection" class="mt-4">
            <h4 class="mb-3"><i class="fas fa-table"></i> All Post Offices</h4>
            <div class="table-responsive">
                <table id="postOfficeTable" class="table table-striped table-bordered" style="width:100%">
                    <thead class="thead-dark">
                        <tr>
                            <th>#</th>
                            <th>AREA</th>
                            <th>POSTAL OFFICE</th>
                            <th>ADDRESS</th>
                            <th>ZIP CODE</th>
                            <th>SPEED</th>
                            <th>STATUS</th>
                            <th>POSTMASTER</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MAP MODAL -->
    <div class="modal fade" id="mapmodal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">Map View</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body p-0">
                    <div id="leafletMap" style="height: 500px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Script - DataTables and jQuery loaded by main-layout -->

</div>

</body>
</html>
