<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::content})}">

<head>
    <title>Branch Locator - PHLPost</title>
</head>

<body th:data-is-area-admin="${isAreaAdmin}">

<div th:fragment="content">

    <div class="container-fluid py-4">

        <!-- ── Geographic Distribution ─────────────────────────── -->
        <div class="row mb-4">

            <!-- Branch Locator Card -->
            <div class="col-md-8 mb-3 mb-md-0">
                <div class="card shadow-sm h-100" style="border-radius:12px;overflow:hidden;border:1px solid #e3e6f0;">
                    <!-- Card Header -->
                    <div class="card-header d-flex align-items-center justify-content-between py-2 px-3"
                         style="background:linear-gradient(135deg,#002868 0%,#1a3a7a 100%);border-bottom:none;">
                        <span class="font-weight-bold text-white" style="font-size:14px;">
                            <i class="fas fa-map-marked-alt mr-2"></i>Branch Locator
                        </span>
                       
                    </div>
                    <!-- Card Body -->
                    <div class="card-body p-3">
                        <div id="map" style="height:400px;border-radius:8px;overflow:hidden;"></div>

                        <!-- Legend -->
                        <div class="mt-3 p-2 rounded" id="mapLegend"
                             style="background:#f8f9fc;border:1px solid #e3e6f0;">
                            <small class="d-block mb-2 font-weight-bold text-muted text-uppercase"
                                   style="font-size:10px;letter-spacing:.5px;">
                                <i class="fas fa-layer-group mr-1"></i>Area Legend
                            </small>
                            <div class="row">
                                <div class="col-12">
                                    <!-- System Admin sees all areas -->
                                    <div th:if="${isSystemAdmin}">
                                        <div class="row" style="row-gap:4px;">
                                            <div class="col-6">
                                                <div class="d-flex flex-column" style="gap:5px;">
                                                    <span data-area="1" style="font-size:12px;"><span style="background:#FF6B6B;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 1</span>
                                                    <span data-area="2" style="font-size:12px;"><span style="background:#4ECDC4;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 2</span>
                                                    <span data-area="3" style="font-size:12px;"><span style="background:#45B7D1;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 3</span>
                                                    <span data-area="4" style="font-size:12px;"><span style="background:#FFA07A;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 4</span>
                                                    <span data-area="5" style="font-size:12px;"><span style="background:#98D8C8;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 5</span>
                                                </div>
                                            </div>
                                            <div class="col-6">
                                                <div class="d-flex flex-column" style="gap:5px;">
                                                    <span data-area="6" style="font-size:12px;"><span style="background:#F7DC6F;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 6</span>
                                                    <span data-area="7" style="font-size:12px;"><span style="background:#BB8FCE;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 7</span>
                                                    <span data-area="8" style="font-size:12px;"><span style="background:#F8B739;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 8</span>
                                                    <span data-area="9" style="font-size:12px;"><span style="background:#85C1E2;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 9</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Area Admin sees only assigned area -->
                                    <div th:if="${isAreaAdmin}">
                                        <span data-area="1" style="font-size:12px;"><span style="background:#FF6B6B;width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle;"></span>Area 1</span>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search & Filters Column -->
            <div class="col-md-4">
                <div class="d-flex flex-column" style="gap:12px;">
                    <!-- Search Card -->
                    <div class="card shadow-sm" style="border-radius:12px;overflow:hidden;border:1px solid #e3e6f0;">
                        <!-- Card Header -->
                        <div class="card-header d-flex align-items-center py-2 px-3"
                             style="background:linear-gradient(135deg,#4e73df 0%,#224abe 100%);border-bottom:none;">
                            <span class="font-weight-bold text-white" style="font-size:14px;">
                                <i class="fas fa-search mr-2"></i>Search Location
                            </span>
                        </div>
                        <!-- Card Body -->
                        <div class="card-body p-3">
                            <div style="position:relative;">
                                <input type="text" id="searchInput" class="form-control"
                                       placeholder="Enter post office name..."
                                       style="border-radius:8px;border:1px solid #d1d3e2;font-size:13px;padding-left:36px;">
                                <i class="fas fa-map-marker-alt"
                                   style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#b0b7c3;font-size:13px;pointer-events:none;"></i>
                            </div>
                            
                            <!-- Suggestions Box - positioned below -->
                            <div id="mapSearchSuggestions" class="mt-2"
                                 style="display:none;background:#fff;border:1px solid #d1d3e2;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);max-height:240px;overflow-y:auto;">
                            </div>
                        </div>
                    </div>

                    <!-- Map Filters Card -->
                    <div class="card shadow-sm" style="border-radius:12px;overflow:hidden;border:1px solid #e3e6f0;">
                        <!-- Card Header -->
                        <div class="card-header d-flex align-items-center py-2 px-3"
                             style="background:linear-gradient(135deg,#4e73df 0%,#224abe 100%);border-bottom:none;">
                            <span class="font-weight-bold text-white" style="font-size:14px;">
                                <i class="fas fa-filter mr-2"></i>Map Filters
                            </span>
                        </div>
                        <!-- Card Body -->
                        <div class="card-body p-3">
                            <div class="mb-3">
                                <label class="d-block mb-1 font-weight-bold text-muted text-uppercase"
                                       style="font-size:10px;letter-spacing:.5px;">
                                    <i class="fas fa-map mr-1"></i>Area
                                </label>
                                <select th:if="${isSystemAdmin}" id="areaFilter" class="form-control"
                                        style="border-radius:8px;border:1px solid #d1d3e2;font-size:13px;">
                                    <option value="">All Areas</option>
                                </select>
                                <select th:unless="${isSystemAdmin}" id="areaFilter" class="form-control"
                                        style="border-radius:8px;border:1px solid #d1d3e2;font-size:13px;">
                                    <option value="1">Area 1</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="d-block mb-1 font-weight-bold text-muted text-uppercase"
                                       style="font-size:10px;letter-spacing:.5px;">
                                    <i class="fas fa-wifi mr-1"></i>Connectivity Status
                                </label>
                                <select id="statusFilter" class="form-control"
                                        style="border-radius:8px;border:1px solid #d1d3e2;font-size:13px;">
                                    <option value="">All Status</option>
                                    <option value="true">&#9679; Connected</option>
                                    <option value="false">&#9679; Disconnected</option>
                                </select>
                            </div>
                            <div>
                                <label class="d-block mb-1 font-weight-bold text-muted text-uppercase"
                                       style="font-size:10px;letter-spacing:.5px;">
                                    <i class="fas fa-sliders-h mr-1"></i>Actions
                                </label>
                                <div class="d-flex" style="gap:8px;">
                                    <button id="applyFilters" class="btn btn-primary font-weight-bold flex-fill"
                                            style="border-radius:8px;font-size:13px;">
                                        <i class="fas fa-search mr-1"></i>Apply Filters
                                    </button>
                                    <button id="clearFilters" class="btn btn-outline-secondary"
                                            style="border-radius:8px;font-size:13px;">
                                        <i class="fas fa-times mr-1"></i>Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
