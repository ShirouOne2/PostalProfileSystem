<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Post Office Inventory - PHLPost</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/table.css}">
    <link rel="stylesheet" th:href="@{/css/table-custom.css}">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
</head>
<body>

<div th:fragment="content">
    <div class="bg-white rounded shadow-sm p-4">

        <!-- Page Title -->
        <div class="mb-4">
            <h3 class="mb-1">Post Offices</h3>
            <p class="text-muted mb-0">Static preview of post office records</p>
        </div>

        <!-- Quick Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="border rounded p-3 text-center">
                    <h5 class="mb-0" th:text="${totalCount}">0</h5>
                    <small class="text-muted">Total Offices</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border rounded p-3 text-center">
                    <h5 class="mb-0" th:text="${areaCount}">0</h5>
                    <small class="text-muted">Areas</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border rounded p-3 text-center">
                    <h5 class="mb-0" th:text="${activeCount}">0</h5>
                    <small class="text-muted">Active</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="border rounded p-3 text-center">
                    <h5 class="mb-0" th:text="${inactiveCount}">0</h5>
                    <small class="text-muted">Inactive</small>
                </div>
            </div>
        </div>

        <!-- Search & entries -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="d-flex align-items-center">
                    <label class="me-2 mb-0 text-muted">Show</label>
                    <select id="entriesLimit" class="form-select form-select-sm" style="width:auto;">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span class="ms-2 text-muted">entries per page</span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="d-flex justify-content-end">
                    <div class="input-group" style="max-width:300px;">
                        <span class="input-group-text bg-dark text-white border-secondary">
                            <i class='bx bx-search'></i>
                        </span>
                        <input type="text" id="tableSearch" class="form-control form-control-sm" placeholder="Search...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            <table id="staticTable" class="table table-bordered table-hover display nowrap" style="width:100%">
                <thead class="thead-light">
                    <tr>
                        <th style="width:50px;">#</th>
                        <th>Post Office Name</th>
                        <th>Area</th>
                        <th>City</th>
                        <th>Status</th>
                        <th class="text-center" style="width:200px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="office, iter : ${offices}">
                        <td class="row-number"></td>
                        <td th:text="${office.name}">Post Office</td>
                        <td th:text="${office.area != null ? office.area.areaName : '—'}">Area</td>
                        <td th:text="${office.cityMunicipality != null ? office.cityMunicipality.name : '—'}">City</td>
                        <td>
                            <span th:if="${office.connectionStatus}" class="badge badge-success">Active</span>
                            <span th:if="${!office.connectionStatus}" class="badge badge-danger">Inactive</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <button type="button" class="btn btn-info btn-sm btn-view" th:data-id="${office.id}" title="View">
                                    <i class='bx bx-show'></i> View
                                </button>
                                <button type="button" class="btn btn-warning btn-sm btn-edit" th:data-id="${office.id}" title="Edit">
                                    <i class='bx bx-edit'></i> Edit
                                </button>
                                <button type="button" class="btn btn-danger btn-sm btn-delete" th:data-id="${office.id}" th:data-name="${office.name}" title="Delete">
                                    <i class='bx bx-trash'></i> Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <!-- Custom Table JS -->
    <script th:src="@{/js/table.js}"></script>
</div>

</body>
</html>
