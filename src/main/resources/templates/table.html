<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, ~{::section})}">

<title>Post Office Inventory - PHLPost</title>

<section>

<div class="bg-white rounded shadow-sm p-4">

    <div class="mb-4">
        <h3 class="mb-1">Post Offices</h3>
        <p class="text-muted mb-0">Manage and view all post office records</p>
    </div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="border rounded p-3 text-center">
                <h5 th:text="${totalCount}">1258</h5>
                <small>Total Offices</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="border rounded p-3 text-center">
                <h5 th:text="${areaCount}">9</h5>
                <small>Areas</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="border rounded p-3 text-center">
                <h5 th:text="${activeCount}">629</h5>
                <small>Active</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="border rounded p-3 text-center">
                <h5 th:text="${inactiveCount}">629</h5>
                <small>Inactive</small>
            </div>
        </div>
    </div>

    <table id="myTable" class="display" style="width:100%">
        <thead>
        <tr>
            <th>#</th>
            <th>Post Office Name</th>
            <th>Area</th>
            <th>City</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="office, iter : ${offices}">
            <td th:text="${office.id}"></td>
            <td th:text="${office.name}"></td>
            <!-- FIX: Safe navigation operator for null checks -->
            <td th:text="${office.area != null ? office.area.areaName : 'N/A'}"></td>
            <td th:text="${office.cityMunicipality != null ? office.cityMunicipality.name : 'N/A'}"></td>
            <td>
                <span th:if="${office.connectionStatus}" class="badge badge-success">Active</span>
                <span th:unless="${office.connectionStatus}" class="badge badge-warning">Inactive</span>
            </td>
            <td>
                <a th:href="@{/profile/{id}(id=${office.id})}" class="btn btn-sm btn-primary">
                    <i class="fas fa-eye"></i>
                </a>
                <button class="btn btn-sm btn-danger btn-delete"
                        th:data-office-id="${office.id}"
                        th:data-office-name="${office.name}">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</section>
</html>
